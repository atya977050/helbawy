plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halabawy.office'
    compileSdk 35

    defaultConfig {
        applicationId 'com.halabawy.office'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}

