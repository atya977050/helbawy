<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الهلباوي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding-top: 15vh;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 16px; }
        .badge {
            background: #e2e8f0;
            color: #0f172a;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
        }
        .expired { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card" id="app-content">
        <h1>مرحباً بكم في مشروع الهلباوي</h1>
        <p>هذه النسخة التجريبية الخاصة بالمشروع.</p>
        <div id="trial-info" class="badge">جاري التحقق من النسخة...</div>
    </div>

    <script>
        const TRIAL_DAYS = 15;
        const MILLIS_PER_DAY = 24 * 60 * 60 * 1000;
        
        let startTime = localStorage.getItem('helbawy_trial_start');
        
        if (!startTime) {
            startTime = new Date().getTime();
            localStorage.setItem('helbawy_trial_start', startTime);
        }
        
        const now = new Date().getTime();
        const elapsedMillis = now - startTime;
        const elapsedDays = Math.floor(elapsedMillis / MILLIS_PER_DAY);
        const remainingDays = TRIAL_DAYS - elapsedDays;
        
        const infoDiv = document.getElementById('trial-info');
        
        if (remainingDays > 0) {
            infoDiv.innerHTML = `النسخة التجريبية: متبقي ${remainingDays} يوم`;
        } else {
            infoDiv.innerHTML = "<span class='expired'>انتهت فترة التجربة (15 يوماً)</span>";
            document.querySelector('p').innerHTML = "يرجى الترقية للحصول على النسخة الكاملة.";
        }
    </script>

</body>
</html>
