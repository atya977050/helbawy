<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبقرينو</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0b;
    color:#f4d66d;
    font-family:Tahoma,Arial,sans-serif;
}
.container{
    width:min(900px,92%);
    text-align:center;
}
h1{font-size:42px;margin:0 0 10px}
.subtitle{color:#c8bd91;font-size:18px;margin-bottom:35px}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}
.card{
    display:block;
    text-decoration:none;
    background:#141414;
    border:1px solid #5f4d1a;
    border-radius:22px;
    padding:35px 22px;
    color:#f4d66d;
    transition:.2s;
}
.card:hover{
    background:#211e11;
    transform:translateY(-3px);
}
.icon{font-size:55px;margin-bottom:15px}
.card h2{margin:8px 0;font-size:25px}
.card p{color:#c8bd91;line-height:1.8}
</style>
</head>
<body>

<div class="container">
    <h1>🤖 عبقرينو</h1>
    <div class="subtitle">
        نظام إنشاء وإصلاح البرامج
    </div>

    <div class="cards">

        <a class="card" href="/index.html">
            <div class="icon">🆕</div>
            <h2>إنشاء برنامج جديد</h2>
            <p>
                ابدأ من فكرة جديدة، وأجب عن الأسئلة
                واختر الشاشات والتصميمات.
            </p>
        </a>

        <a class="card" href="/repair.html">
            <div class="icon">🔧</div>
            <h2>إصلاح برنامج موجود</h2>
            <p>
                افحص البرنامج، اكتشف المشاكل،
                وحلل السبب وخطة الإصلاح.
            </p>
        </a>

    </div>
</div>

</body>
</html>
