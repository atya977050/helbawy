<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبقرينو — استوديو إصلاح البرامج</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07111f;
 color:#eef4ff;
}
header{
 padding:24px;
 text-align:center;
 background:#0b1b31;
 border-bottom:1px solid #203957;
}
h1{margin:0 0 8px}
.sub{color:#9eb3cc}
main{max-width:1100px;margin:auto;padding:22px}
.panel{
 background:#0d1d32;
 border:1px solid #23405f;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
}
input{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid #31506f;
 background:#081523;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:12px;
 padding:12px 18px;
 margin:6px;
 cursor:pointer;
 font-weight:bold;
}
.primary{background:#d7ad45;color:#111}
.secondary{background:#244767;color:white}
.danger{background:#7e2934;color:white}
.card{
 background:#091727;
 border:1px solid #294662;
 border-radius:15px;
 padding:16px;
 margin-top:12px;
}
.status{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#183958;
 color:#bcd7f2;
}
pre{
 white-space:pre-wrap;
 background:#050d16;
 padding:15px;
 border-radius:12px;
 overflow:auto;
}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>🤖 عبقرينو</h1>
<div class="sub">استوديو إصلاح البرامج</div>
</header>

<main>

<section class="panel">
<h2>🔧 البرنامج المراد إصلاحه</h2>
<p>اكتب مسار البرنامج الموجود على الجهاز.</p>

<input
 id="projectPath"
 placeholder="/data/data/com.termux/files/home/my-project">

<br><br>

<button class="primary" onclick="scanProject()">
🔍 فحص البرنامج
</button>

<button class="secondary" onclick="location.href='/'">
🆕 إنشاء برنامج جديد
</button>
</section>

<section id="scanPanel" class="panel hidden">
<h2>📊 نتيجة الفحص</h2>
<div id="scanResult"></div>

<button class="primary" onclick="analyzeRootCause()">
🧠 تحليل السبب الجذري
</button>
</section>

<section id="causePanel" class="panel hidden">
<h2>🧠 تحليل المشاكل</h2>
<div id="causeResult"></div>

<button class="primary" onclick="buildRepairPlan()">
📋 إنشاء خطة الإصلاح
</button>
</section>

<section id="planPanel" class="panel hidden">
<h2>📋 خطة الإصلاح</h2>
<div id="planResult"></div>

<h3>🎯 مرشحو الإصلاح</h3>
<div id="candidatesResult"></div>

<button class="danger" onclick="rejectRepairs()">
✕ رفض الخطة
</button>
</section>

<section id="repairPanel" class="panel hidden">
<h2>🛠️ الإصلاح المحدد</h2>
<div id="repairResult"></div>

<label>الملف المستهدف</label>
<input id="repairTarget" readonly>

<label>سبب الإصلاح</label>
<input id="repairReason" readonly>

<br><br>

<label>النص القديم — يجب أن يكون مطابقًا تمامًا</label>
<textarea id="oldText"
 style="width:100%;min-height:130px;padding:12px;border-radius:12px;background:#081523;color:white;border:1px solid #31506f"></textarea>

<br><br>

<label>النص الجديد</label>
<textarea id="newText"
 style="width:100%;min-height:130px;padding:12px;border-radius:12px;background:#081523;color:white;border:1px solid #31506f"></textarea>

<br><br>

<button class="primary" onclick="approveSelectedCandidate()">
✅ اعتماد هذا المرشح
</button>

<button class="primary" onclick="executeRepair()">
🚀 تنفيذ الإصلاح المعتمد
</button>
</section>

<section id="verifyPanel" class="panel hidden">
<h2>🔎 التحقق النهائي</h2>
<div id="verifyResult"></div>

<button class="primary" onclick="verifyRepair()">
♻️ إعادة الفحص والتحقق
</button>
</section>

<section id="reportPanel" class="panel hidden">
<h2>📄 التقرير النهائي</h2>
<div id="reportResult"></div>
</section>

</main>

<script>

let state = {
 projectPath:"",
 scan:null,
 cause:null,
 plan:null,
 approved:false,
 candidate:null,
 approval:null,
 generation:null,
 repair:null,
 verification:null
};

function show(id){
 document.getElementById(id).classList.remove("hidden");
}

function esc(value){
 return String(value ?? "").replace(/[&<>"']/g,function(m){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m];
 });
}

async function api(url,data){
 const response = await fetch(url,{
  method:"POST",
  headers:{
   "Content-Type":"application/json"
  },
  body:JSON.stringify(data)
 });

 return await response.json();
}

async function scanProject(){

 state.projectPath =
  document.getElementById("projectPath").value.trim();

 if(!state.projectPath){
  alert("اكتب مسار البرنامج أولًا");
  return;
 }

 const data = await api(
  "/api/repair/scan",
  {project_path:state.projectPath}
 );

 state.scan=data;

 show("scanPanel");

 document.getElementById("scanResult").innerHTML =
  '<div class="card">' +
  '<span class="status">' +
  esc(data.status || "تم الفحص") +
  '</span>' +
  '<pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre>' +
  '</div>';
}

async function analyzeRootCause(){

 const data = await api(
  "/api/repair/root-cause",
  {
   project_path:state.projectPath,
   scan:state.scan
  }
 );

 state.cause=data;
 show("causePanel");

 document.getElementById("causeResult").innerHTML =
  '<div class="card"><pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre></div>';
}

async function buildRepairPlan(){

 const data = await api(
  "/api/repair/plan",
  {
   project_path:state.projectPath,
   scan:state.scan,
   cause:state.cause
  }
 );

 state.plan=data;
 show("planPanel");

 document.getElementById("planResult").innerHTML =
  '<div class="card"><pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre></div>';

 renderCandidates(
  data.repair_candidates || []
 );
}

function renderCandidates(candidates){

 const box =
  document.getElementById("candidatesResult");

 if(!candidates.length){
  box.innerHTML =
   '<div class="card">' +
   '<span class="status">لا توجد مرشحات إصلاح</span>' +
   '<p>لم ينتج المحرك مرشح إصلاح قابلًا للاعتماد.</p>' +
   '</div>';
  return;
 }

 box.innerHTML = candidates.map(function(c, i){

  return '<div class="card">' +
   '<h3>' + esc(c.title || c.reason || "مرشح إصلاح") + '</h3>' +
   '<p><b>Candidate:</b> ' + esc(c.candidate_id || "") + '</p>' +
   '<p><b>Target:</b> ' + esc(c.target || "") + '</p>' +
   '<p><b>Severity:</b> ' + esc(c.severity || "") + '</p>' +
   '<p><b>Status:</b> ' + esc(c.status || "") + '</p>' +
   '<p>' + esc(c.classification || "") + '</p>' +
   '<button class="primary" onclick="selectCandidate(' + i + ')">' +
   '🎯 اختيار هذا المرشح' +
   '</button>' +
   '</div>';

 }).join("");
}

function selectCandidate(index){

 const candidates =
  state.plan &&
  state.plan.repair_candidates
   ? state.plan.repair_candidates
   : [];

 const candidate = candidates[index];

 if(!candidate){
  alert("مرشح الإصلاح غير موجود");
  return;
 }

 state.candidate = candidate;
 state.approved = false;
 state.approval = null;

 show("repairPanel");

 document.getElementById("repairTarget").value =
  candidate.target || "";

 document.getElementById("repairReason").value =
  candidate.reason ||
  candidate.title ||
  candidate.candidate_id ||
  "";

 document.getElementById("oldText").value = "";
 document.getElementById("newText").value = "";

 state.generation = null;

 document.getElementById("repairResult").innerHTML =
  '<div class="card">' +
  '<span class="status">تم اختيار المرشح</span>' +
  '<p><b>' + esc(candidate.candidate_id || "") + '</b></p>' +
  '<p>ولّد عبقرينو الإصلاح من الأدلة الفعلية قبل الاعتماد.</p>' +
  '<button class="primary" onclick="generateRepair()">' +
  '⚙️ توليد الإصلاح تلقائيًا' +
  '</button>' +
  '</div>';
}

async function generateRepair(){

 if(!state.candidate){
  alert("اختر مرشح إصلاح أولًا");
  return;
 }

 const data = await api(
  "/api/repair/generate",
  {
   project_path:state.projectPath,
   candidate:state.candidate
  }
 );

 state.generation=data;

 if(data.status !== "GENERATED" || !data.generation){
  document.getElementById("repairResult").innerHTML =
   '<div class="card">' +
   '<span class="status">تم حظر توليد الإصلاح</span>' +
   '<pre>' + esc(JSON.stringify(data,null,2)) + '</pre>' +
   '<p>لم يتم تغيير أي ملف.</p>' +
   '</div>';
  return;
 }

 const g = data.generation;

 document.getElementById("oldText").value =
  g.old_text || "";

 document.getElementById("newText").value =
  g.new_text || "";

 document.getElementById("repairResult").innerHTML =
  '<div class="card">' +
  '<span class="status">تم توليد الإصلاح — في انتظار الموافقة</span>' +
  '<p><b>Target:</b> ' + esc(g.target || "") + '</p>' +
  '<p><b>Generator:</b> ' + esc(g.generator || "") + '</p>' +
  '<p><b>Before SHA-256:</b> ' + esc(g.before_sha256 || "") + '</p>' +
  '<p><b>Old Text:</b></p>' +
  '<pre>' + esc(g.old_text || "") + '</pre>' +
  '<p><b>New Text:</b></p>' +
  '<pre>' + esc(g.new_text || "") + '</pre>' +
  '<p>التنفيذ غير مسموح به قبل الاعتماد.</p>' +
  '</div>';
}

async function approveSelectedCandidate(){

 if(!state.candidate){
  alert("اختر مرشح إصلاح أولًا");
  return;
 }

 if(!state.generation || state.generation.status !== "GENERATED"){
  alert("يجب توليد الإصلاح تلقائيًا أولًا.");
  return;
 }

 const data = await api(
  "/api/repair/approve",
  {
   project_path:state.projectPath,
   candidate_id:state.candidate.candidate_id
  }
 );

 state.approval=data;
 state.approved =
  data.status === "approved" &&
  data.approval &&
  data.approval.approved === true;

 document.getElementById("repairResult").innerHTML =
  '<div class="card">' +
  '<span class="status">' +
  esc(data.status || "نتيجة الاعتماد") +
  '</span>' +
  '<pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre>' +
  '</div>';
}

function rejectRepairs(){

 state.approved=false;
 state.candidate=null;
 state.approval=null;

 alert("تم رفض خطة الإصلاح. لم يتم تنفيذ أي تعديل.");
}

async function executeRepair(){

 if(!state.approved){
  alert("يجب اعتماد مرشح الإصلاح أولًا");
  return;
 }

 if(!state.candidate){
  alert("لا يوجد مرشح محدد");
  return;
 }

 if(!state.generation || state.generation.status !== "GENERATED"){
  alert("لا يوجد إصلاح مولّد قابل للتنفيذ.");
  return;
 }

 const generated =
  state.generation.generation;

 const oldText = generated.old_text || "";
 const newText = generated.new_text || "";

 if(!oldText || !newText){
  alert("بيانات الإصلاح المولّد غير مكتملة.");
  return;
 }

 const data = await api(
  "/api/repair/execute",
  {
   project_path:state.projectPath,
   scan:state.scan,
   cause:state.cause,
   plan:state.plan,
   candidate_id:state.candidate.candidate_id,
   target:state.candidate.target,
   reason:
    state.candidate.reason ||
    state.candidate.title ||
    state.candidate.candidate_id,
   old_text:oldText,
   new_text:newText
  }
 );

 state.repair=data;

 show("verifyPanel");

 document.getElementById("repairResult").innerHTML =
  '<div class="card"><pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre></div>';
}

async function verifyRepair(){

 if(!state.repair){
  alert("لا يوجد إصلاح للتحقق منه");
  return;
 }

 if(!state.generation || state.generation.status !== "GENERATED"){
  alert("لا يوجد إصلاح مولّد للتحقق منه.");
  return;
 }

 const generated =
  state.generation.generation;

 const oldText = generated.old_text || "";
 const newText = generated.new_text || "";

 const data = await api(
  "/api/repair/verify",
  {
   project_path:state.projectPath,
   previous_scan:state.scan,
   repair:state.repair,
   old_text:oldText,
   new_text:newText
  }
 );

 state.verification=data;

 show("reportPanel");

 document.getElementById("verifyResult").innerHTML =
  '<div class="card"><pre>' +
  esc(JSON.stringify(data,null,2)) +
  '</pre></div>';

 document.getElementById("reportResult").innerHTML =
  '<div class="card">' +
  '<span class="status">اكتمل مسار الإصلاح والتحقق</span>' +
  '<pre>' +
  esc(JSON.stringify(state,null,2)) +
  '</pre>' +
  '</div>';
}

</script>

</body>
</html>
