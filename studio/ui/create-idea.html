<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبقرينو — فكرة البرنامج</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#07111f;color:#fff}
body{min-height:100vh}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(900px,100%);padding:42px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(14,29,48,.94);box-shadow:0 30px 90px rgba(0,0,0,.45)}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#183b61;color:#bcd8f4;margin-bottom:18px}
h1{margin:0 0 12px;font-size:40px}
p{color:#aebed2;font-size:18px;line-height:1.8}
textarea{width:100%;min-height:220px;resize:vertical;border:1px solid #31506f;border-radius:20px;background:#081523;color:#fff;padding:20px;font:inherit;font-size:18px;outline:none}
textarea:focus{border-color:#6fa8dc;box-shadow:0 0 0 3px rgba(111,168,220,.12)}
.actions{display:flex;gap:14px;margin-top:20px}
button{border:0;border-radius:18px;padding:16px 26px;color:#fff;background:#1769aa;cursor:pointer;font-size:18px;font-weight:700}
button:disabled{opacity:.55;cursor:wait}
.status{margin-top:18px;padding:14px;border-radius:14px;background:#0c2035;color:#bcd8f4;display:none}
.error{background:#3a1820;color:#ffc3cc}
@media(max-width:650px){.card{padding:28px 18px}h1{font-size:32px}.actions{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main class="screen" id="ideaScreen">
<section class="card">
<div class="badge">المرحلة 1 — الفكرة</div>
<h1>ما البرنامج الذي تريد إنشاءه؟</h1>
<p>اكتب فكرتك كما هي. سيقوم عبقرينو بتحليلها واستخراج المتطلبات الأولية قبل الانتقال للشاشة التالية.</p>
<input id="projectName" type="text" placeholder="اكتب اسم البرنامج الذي تريد إنشاءه..." autocomplete="off">
<textarea id="idea" placeholder="مثال: أريد برنامجًا لإدارة مكتب محاماة أون لاين..."></textarea>
<div class="actions">
<button id="analyzeButton" onclick="analyzeIdea()">🧠 تحليل الفكرة</button>
<button onclick="location.href=/">↩ العودة</button>
</div>
<div id="status" class="status"></div>
</section>
</main>
<script>
async function analyzeIdea(){
  const projectName=document.getElementById("projectName").value.trim();
  const idea=document.getElementById("idea").value.trim();
  const button=document.getElementById("analyzeButton");
  const status=document.getElementById("status");

  if(!projectName){
    status.textContent="اكتب اسم البرنامج أولًا.";
    return;
  }
  if(!idea){
    status.textContent="اكتب فكرة البرنامج أولًا.";
    status.className="status error";
    status.style.display="block";
    return;
  }
  button.disabled=true;
  status.className="status";
  status.textContent="";
  status.style.display="none";
  try{
    const response=await fetch("/api/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        project_name:projectName,
        idea
      })
    });
    const result=await response.json();
    if(!response.ok || !result.ok) throw new Error(result.error||"تعذر تحليل الفكرة");
    sessionStorage.setItem("abqarynoIdea",idea);
    sessionStorage.setItem("abqarynoProjectName",projectName);
      sessionStorage.setItem("abqarynoAnalysis",JSON.stringify(result));
    sessionStorage.setItem("abqarynoIdea", idea);
location.href="/create/understanding";
  }catch(error){
    status.className="status error";
    status.textContent=error.message;
    status.style.display="block";
    button.disabled=false;
  }
}
</script>
</body>
</html>
