<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عبقرينو — فهم الفكرة</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui;background:#07111f;color:#fff}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(950px,100%);padding:42px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(14,29,48,.95);box-shadow:0 30px 90px rgba(0,0,0,.45)}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#183b61;color:#bcd8f4;margin-bottom:18px}h1{margin:0 0 12px;font-size:40px}.intro{color:#aebed2;font-size:18px;line-height:1.8}.idea{margin:20px 0;padding:20px;border-radius:20px;background:#0a1a2b;border:1px solid #294663;line-height:1.9}.actions{display:flex;gap:12px;margin-top:24px}button{border:0;border-radius:14px;padding:14px 24px;color:#fff;cursor:pointer;font-size:17px;font-weight:700}.primary{background:#1769aa;flex:1}.secondary{background:#572532}@media(max-width:650px){.card{padding:28px 18px}h1{font-size:32px}.actions{flex-direction:column}}</style></head><body><main class="screen"><section class="card"><div class="badge">المرحلة 2 — فهم الفكرة</div><h1>دعنا نفهم البرنامج أولًا</h1><p class="intro">عبقرينو سيعرض الفكرة كما فهمها قبل الانتقال إلى تحديد المتطلبات والشاشات.</p><div class="idea" id="idea">جاري تحميل الفكرة...</div><div class="actions"><button class="secondary" onclick="location.href=&quot;/create&quot;">✏️ تعديل الفكرة</button><button class="primary" onclick="continueNext()">✅ الفهم صحيح — المتطلبات</button></div></section></main><script>const idea=sessionStorage.getItem("abqarynoIdea")||"لم يتم إدخال فكرة.";document.getElementById("idea").textContent=idea;function continueNext(){location.href="/create/requirements";}</script></body></html>
