<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبقرينو</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#07111f;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(920px,100%);padding:42px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(14,29,48,.92);box-shadow:0 30px 90px rgba(0,0,0,.45);text-align:center}
.logo{font-size:58px;margin-bottom:10px}
h1{margin:0;font-size:42px}
.subtitle{margin:12px 0 38px;color:#aebed2;font-size:18px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
button{border:0;border-radius:22px;padding:28px 20px;color:#fff;background:#122b47;cursor:pointer;font-size:20px;font-weight:700;transition:.2s}
button:hover{transform:translateY(-3px);background:#183b61}
.icon{font-size:42px;display:block;margin-bottom:12px}
small{display:block;margin-top:8px;color:#9eb0c5;font-weight:400}
@media(max-width:650px){.card{padding:28px 18px}.actions{grid-template-columns:1fr}h1{font-size:34px}.logo{font-size:48px}}
</style>
</head>
<body>
<main class="screen" id="startScreen">
<section class="card">
<div class="logo">🤖</div>
<h1>عبقرينو</h1>
<div class="subtitle">نظام ذكي لإنشاء وإصلاح البرامج</div>
<div class="actions">
<button onclick="openScreen(create)">
<span class="icon">🆕</span>
إنشاء برنامج جديد
<small>ابدأ من فكرة جديدة</small>
</button>
<button onclick="openScreen(repair)">
<span class="icon">🔧</span>
إصلاح برنامج موجود
<small>افحص البرنامج وحدد المشكلة</small>
</button>
</div>
</section>
</main>
<script>
function openScreen(type){
  if(type==="create") window.location.href="/create";
  if(type==="repair") window.location.href="/repair";
}
</script>
</body>
</html>
